 {id:"nordic",price:"",img:"images/north-scene.jpg",poster:"images/poster-north.jpg",

const MOODS=[["city1","Snowy Christmas market with a lit tree","سوق كريسمس مغطى بالثلج وشجرة مضيئة"],["city2","Visitors walking through a Christmas market at dusk","زوار في سوق كريسمس وقت الغروب"],["city3","Golden angel statue and a domed church at sunset","تمثال ملاك ذهبي وكنيسة بقبة عند الغروب"],["city4","Old bridge over the river at sunset","جسر قديم فوق النهر عند الغروب"],["city5","Old town street with twin towers","شارع في مدينة قديمة وأبراج مزدوجة"],["city6","Church square with birds in a blue sky","ساحة كنيسة وطيور في سماء زرقاء"],["night","European city lights at night","أضواء المدينة"],["walker","Traveler in a snowy Nordic city","مدينة شمالية مثلجة"],["north-scene","Nordic city with northern lights","الشفق القطبي"]];

let L="ar";try{L=localStorage.getItem("emyL")||"ar"}catch(e){}
const $=s=>document.querySelector(s),app=$("#app"),T=k=>S[L][k],X=o=>o[L];
const clean=s=>s.replace(/[🎄✨]/gu,"").trim();
const waLink=t=>`https://wa.me/${SITE.wa}${t?`?text=${encodeURIComponent(t)}`:""}`;
const priceHTML=t=>t.price?`<div class="price"><small>${T("from")}</small><strong class="ltr">${t.price}</strong> <small style="display:inline">${T("per")}</small></div>`:`<div class="price q"><strong>${T("askP")}</strong></div>`;
const opts=sel=>TRIPS.map(t=>`<option value="${t.id}" ${t.id===sel?"selected":""}>${clean(X(t.title))}</option>`).join("");

function form(sel){return `<div class="formbox"><h3>${T("fT")}</h3><form novalidate onsubmit="return send(event)">
<label for="n">${T("name")}</label><input id="n" name="n" autocomplete="name"><div class="err" data-e="n"></div>
<label for="t">${T("trip")}</label><select id="t" name="t"><option value="">${T("choose")}</option>${opts(sel)}</select><div class="err" data-e="t"></div>
<div class="row"><div><label for="a">${T("ad")}</label><input id="a" name="a" type="number" min="1" inputmode="numeric"><div class="err" data-e="a"></div></div>
<div><label for="c">${T("ch")}</label><input id="c" name="c" type="number" min="0" inputmode="numeric"></div></div>
<label for="d">${T("dt")}</label><input id="d" name="d" placeholder="${T("dph")}">
<label for="m">${T("nt")}</label><textarea id="m" name="m" rows="3"></textarea>
<button class="btn" type="submit">${T("send")}</button><p class="note">${T("note")}</p></form></div>`}

function send(e){e.preventDefault();const f=e.target,v=n=>f[n].value.trim();let ok=true;
 const need={n:T("eN"),t:T("eT"),a:T("eA")};
 for(const k in need){const bad=!v(k)||(k==="a"&&+v("a")<1);f.querySelector(`[data-e=${k}]`).textContent=bad?need[k]:"";if(bad)ok=false}
 if(!ok)return false;const tr=TRIPS.find(x=>x.id===v("t"));
 const l=[T("m0"),"",`${T("lN")}: ${v("n")}`,`${T("lT")}: ${clean(X(tr.title))}`,`${T("lA")}: ${v("a")}`];
 if(v("c"))l.push(`${T("lC")}: ${v("c")}`);if(v("d"))l.push(`${T("lD")}: ${v("d")}`);if(v("m"))l.push(`${T("lNt")}: ${v("m")}`);
 l.push("",T("m9"));window.open(waLink(l.join("\n")),"_blank","noopener");return false}

const card=t=>`<article class="card"><img src="${t.img}" alt="${X(t.alt)}" loading="lazy"><div class="cb"><h3>${X(t.title)}</h3>
<div class="dest">${X(t.dest).join(" • ")}</div>${t.duration?`<span class="chip">${X(t.duration)}</span>`:""}<p style="color:var(--mut)">${X(t.desc)}</p>${priceHTML(t)}
<div class="cta"><a class="btn btn-p btn-sm" href="#trip-${t.id}">${T("details")}</a><a class="btn btn-wa btn-sm" target="_blank" rel="noopener" href="${waLink(X(t.msg))}">${T("wa")}</a></div></div></article>`;

function contact(sel){return `<section id="contact" class="contact"><div class="wrap"><h2 class="title">${T("contact")}</h2><p class="sub">${T("ctS")}</p>
<div class="cwrap"><div class="cinfo"><div class="big ltr" dir="ltr">${SITE.phoneDisplay}</div><div class="ltr">${SITE.handle}</div>
<div class="cta" style="max-width:360px"><a class="btn btn-w" href="${SITE.phoneTel}">${T("call")}</a><a class="btn btn-o" target="_blank" rel="noopener" href="${waLink(T("gen"))}">${T("wapp")}</a></div></div>${form(sel)}</div></div></section>`}

function home(){return `
<section class="hero" id="home"><div class="wrap hgrid"><div class="ht">
${OFFER_END>Date.now()?`<div id="offer"><span class="ob">⏳ ${T("offer")}</span><div class="cd" id="cd" role="timer" aria-label="${T("offer")}"></div></div>`:""}
<h1>${T("heroT")}</h1><p>${T("heroP")}</p>
<div class="acts"><a class="btn btn-w" href="#trips">${T("explore")}</a><a class="btn btn-o" href="#contact">${T("contact")}</a></div></div>
</div></section>
<section id="trips" class="alt"><div class="wrap"><h2 class="title">${T("ourT")}</h2><p class="sub">${T("ourS")}</p><div class="grid">${TRIPS.map(card).join("")}</div></div></section>
<section><div class="wrap"><h2 class="title">${T("expT")}</h2><p class="sub">${T("expS")}</p><div class="feat">${T("f").map(f=>`<div class="f"><i>${f[0]}</i><h3>${f[1]}</h3><p>${f[2]}</p></div>`).join("")}</div></div></section>
<section class="alt"><div class="wrap"><h2 class="title">${T("moodT")}</h2><p class="sub">${T("moodS")}</p>
<div class="mood">${MOODS.map(m=>`<img src="images/${m[0]}.jpg" alt="${L==="ar"?m[2]:m[1]}" loading="lazy">`).join("")}</div></div></section>
<section class="steps-sec"><div class="wrap"><h2 class="title">${T("stepsT")}</h2><p class="sub">${T("stepsS")}</p><div class="steps">${T("steps").map(s=>`<div class="st"><h3>${s}</h3></div>`).join("")}</div></div></section>
<section><div class="wrap"><h2 class="title">${T("offT")}</h2><p class="sub">${T("offS")}</p>
<div class="gal">${TRIPS.map(t=>`<a href="#trip-${t.id}"><img src="${t.poster}" alt="${clean(X(t.title))}" loading="lazy"></a>`).join("")}</div></div></section>
<section id="about" class="alt"><div class="wrap about"><div><h2 class="title">${T("about")}</h2><p>${T("ab1")}</p><p>${T("ab2")}</p></div>
<img src="images/night.jpg" alt="${L==="ar"?"مدينة أوروبية ليلًا":"European city at night"}" loading="lazy"></div></section>${contact()}`}

function trip(t){return `
<section class="thero" style="background-image:url(${t.img})"><div class="wrap"><a class="back" href="#trips">${L==="ar"?"→":"←"} ${T("back")}</a>
<h1>${X(t.title)}</h1><div class="dest">${X(t.dest).join(" • ")}</div></div></section>
<section><div class="wrap tgrid"><div><h2>${T("aboutTrip")}</h2><p style="color:var(--mut);margin-bottom:18px;font-size:1.1rem">${X(t.desc)}</p>
${t.duration?`<p style="margin-bottom:18px"><span class="chip">${T("dur")}: ${X(t.duration)}</span></p>`:""}
<h2>${T("svc")}</h2><ul class="svc">${X(t.services).map(s=>`<li>${s}</li>`).join("")}</ul><p class="note" style="margin-bottom:22px">${T("svcN")}</p>
${t.gallery?`<div class="tg">${t.gallery.map((g,i)=>`<img src="images/${g}.jpg" alt="${X(MOODS[i][L==="ar"?2:1]?{ar:MOODS[i][2],en:MOODS[i][1]}:{ar:"",en:""})}" loading="lazy">`).join("")}</div>`:""}<img src="${t.poster}" alt="${T("poster")}" loading="lazy" style="border-radius:18px;max-width:420px;width:100%;box-shadow:0 8px 26px #0a2a5a33"></div>
<aside class="side">${priceHTML(t)}<a class="btn btn-p" target="_blank" rel="noopener" href="${waLink(X(t.msg))}">${T("book")}</a>${form(t.id)}</aside></div></section>
<div class="bar"><div>${t.price?`<small>${T("from")}</small><strong class="ltr">${t.price}</strong>`:`<strong>${T("askP")}</strong>`}</div>
<a class="btn btn-w btn-sm" target="_blank" rel="noopener" href="${waLink(X(t.msg))}">${T("askTrip")}</a></div>`}

function chrome(){document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";
 const nav=[["home","#home"],["trips","#trips"],["about","#about"],["contact","#contact"]];
 $("#navl").innerHTML=nav.map(n=>`<li><a href="${n[1]}">${T(n[0])}</a></li>`).join("");
 $("#footl").innerHTML=$("#navl").innerHTML;
 $("#hwa").textContent=T("wa");$("#hwa").href=waLink(T("gen"));$("#fab").href=waLink(T("gen"));
 $("#lang").textContent=T("lang");$("#lang").setAttribute("aria-label",L==="ar"?"Switch to English":"التبديل إلى العربية");
 $("#ftel").href=SITE.phoneTel;$("#ftel").textContent=SITE.phoneDisplay;
 const nm={facebook:L==="ar"?"فيسبوك":"Facebook",instagram:L==="ar"?"إنستجرام":"Instagram",tiktok:L==="ar"?"تيك توك":"TikTok"};
 $("#social").innerHTML=Object.entries(SITE.social).filter(([,u])=>u).map(([k,u])=>`<li><a href="${u}" target="_blank" rel="noopener">${nm[k]}</a></li>`).join("");
 $("#nav").classList.remove("open")}
function tick(){const el=$("#cd");if(!el)return;let d=OFFER_END-Date.now();
 if(d<=0){$("#offer").remove();return}
 const v=[Math.floor(d/864e5),Math.floor(d/36e5)%24,Math.floor(d/6e4)%60,Math.floor(d/1e3)%60];
 el.innerHTML=v.map((n,i)=>`<div><strong>${String(n).padStart(2,"0")}</strong><small>${T("tl")[i]}</small></div>`).join("")}
function route(keep){const h=location.hash.slice(1),m=h.match(/^trip-(\w+)$/),tr=m&&TRIPS.find(x=>x.id===m[1]);chrome();
 document.body.classList.toggle("trip",!!tr);
 if(tr){app.innerHTML=trip(tr);document.title=`${clean(X(tr.title))} | EMY TOURS`;
  document.querySelector("meta[name=description]").content=`${X(tr.desc)} ${X(tr.dest).join(", ")}. EMY TOURS`;if(keep!==true)scrollTo(0,0)}
 else{app.innerHTML=home();tick();document.title="EMY TOURS | "+(L==="ar"?"رحلات أوروبية جماعية منظّمة":"Organized European Group Trips");
  if(keep!==true){const el=h&&document.getElementById(h);setTimeout(()=>el?el.scrollIntoView():scrollTo(0,0),30)}}}
$("#lang").onclick=()=>{L=L==="ar"?"en":"ar";try{localStorage.setItem("emyL",L)}catch(e){}route(true)};
$("#burger").onclick=e=>{const o=$("#nav").classList.toggle("open");e.currentTarget.setAttribute("aria-expanded",o)};
setInterval(tick,1000);addEventListener("hashchange",()=>route());route();
</script>
</body>
